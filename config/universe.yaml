# The Woodland Fund — universe & backtest configuration
# Liquid US ETF universe (see DESIGN.md §5). ETFs sidestep single-stock
# survivorship bias: these are the actual tradeable instruments.

universe:
  sectors:            # SPDR sector ETFs
    - XLB             # materials        (1998-)
    - XLE             # energy           (1998-)
    - XLF             # financials       (1998-)
    - XLI             # industrials      (1998-)
    - XLK             # technology       (1998-)
    - XLP             # staples          (1998-)
    - XLU             # utilities        (1998-)
    - XLV             # health care      (1998-)
    - XLY             # discretionary    (1998-)
    - XLRE            # real estate      (2015-) — short history, excluded from long backtests
    - XLC             # communications   (2018-) — short history, excluded from long backtests
  broad:
    - SPY             # S&P 500
    - QQQ             # Nasdaq 100
    - IWM             # Russell 2000
    - EFA             # developed ex-US
    - EEM             # emerging markets
  defensive:
    - TLT             # 20+yr treasuries
    - IEF             # 7-10yr treasuries (also the cash-proxy / risk-off leg)
    - GLD             # gold
    - DBC             # commodities      (2006-)

data:
  as_of: "2026-09-04"      # inclusive frozen research snapshot; never a live-feed cutoff
  start: "1998-12-22"      # first date all nine original sector ETFs trade
  primary_source: yahoo    # unadjusted OHLCV + adjusted close in one request

  # Independent second source, cross-checked on every ingest (DESIGN.md §5 as
  # amended 2026-09-01). Tiingo was chosen over Alpaca because its 20+ yrs of
  # adjusted EOD cover the FULL backtest period; Alpaca's shorter free history
  # would leave the early years unguarded. Stooq is retired behind an anti-bot
  # wall. Key: TIINGO_API_KEY in .env (gitignored, never committed).
  # See journal/2026-09-01-second-source-decision.md
  crosscheck_source: tiingo
  # Planning decision 2026-09-01: >2% is a hard failure; >50bps is monitored
  # and reported but does not itself change the verdict.
  crosscheck_fail_tolerance: 0.02
  crosscheck_monitor_tolerance: 0.005
  # Research is bound to this read-only artifact.  Its directory name is the
  # observed content hash, not acceptance of the unresolved replacement anchors.
  store: data/snapshots/etf-4c6a36b8c1e52f2cc50dca437ff4d892dc21a87c96b18ff08de70eb85e84d901
